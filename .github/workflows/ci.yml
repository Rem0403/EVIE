# Runs on every push and pull request. Needs no secrets: the tests mock Firebase,
# the build doesn't need the Firebase config, and the rules tests use a local emulator.
# Actions are pinned to exact commits (the tag is in the comment), so a moved tag can't change
# what runs here; Dependabot proposes updates (.github/dependabot.yml).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Known vulnerabilities in anything shipped to users fail the build (dev tools are reported, not blocking).
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm test
      - run: npm run build

  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:rules
