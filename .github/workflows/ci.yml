# Runs on every push and pull request. Needs no secrets: the tests mock Firebase,
# the build doesn't need the Firebase config, and the rules tests use a local emulator.
# Actions are pinned to exact commits (the tag is in the comment), so a moved tag can't change
# what runs here; Dependabot proposes updates (.github/dependabot.yml).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Known vulnerabilities in anything shipped to users fail the build (dev tools are reported, not blocking).
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm test
      - run: npm run build

  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:rules
